name: Metrics

on:
  schedule:
    - cron: "0 0 * * *"   # daily
  workflow_dispatch:        # manual run button

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # classic PAT with repo scope — add as a repo secret named METRICS_TOKEN
          token: ${{ secrets.METRICS_TOKEN }}
          user: Rasmus257

          # commit the rendered SVG to a dedicated branch (keeps main clean)
          filename: github-metrics.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "chore: update metrics"

          # what to show — includes private commits/PRs/issues via the repo-scope token
          base: header, activity, community, repositories
          base_indepth: yes
          plugin_lines: yes
          config_timezone: Europe/Stockholm
